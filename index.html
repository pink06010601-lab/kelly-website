<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelly's Website</title>
    <style>
        body {
            background-color: #fff0f5;
            font-family: Georgia, serif;
            text-align: center;
            padding: 50px 20px;
            color: #75465c;
        }

        .card {
            background-color: white;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 5px 15px #e8c5d5;
        }

        h1 {
            color: #d77b9f;
        }

        h2 {
            color: #ad6485;
        }

        img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #f6d6e4;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Welcome to My Website!</h1>

        <img src="Snoopy.jpg" alt="Snoopy">

        <h2>Hello, I'm Kelly!</h2>

        <p>I'm a Computer Science student.</p>
        <p>I love baking, traveling, and badminton.</p>
        <p>Thank you for visiting my website!</p>
    </div>
</body>
</html>
